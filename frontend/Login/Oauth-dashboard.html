<!doctype html>
<html lang="en">
    <head>
        <title>Dashboard</title>
        
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link rel="apple-touch-icon" sizes="180x180" href="LoginFavicon_io/apple-touch-icon.png ">
        <link rel="icon" type="image/png" sizes="32x32" href="LoginFavicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="LoginFavicon_io/favicon-16x16.png">
        <link rel="manifest" href="LoginFavicon_io/site.webmanifest">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <link rel="stylesheet" href="css/oauthDashboard.css">
        <script type="module" src="./scripts/username.js"></script>
        <script type="module" src="./scripts/btnDashboard.js"></script>
        <script type="module" src="./scripts/passwordDefined.js"></script>
        <script type="module" src="./scripts/definePassword.js"></script>
        <script type="module" src="./scripts/securityStatus.js"></script>
        <script type="module" src="./scripts/recentActivity.js"></script>
        <script type="module" src="./scripts/accountSummary.js"></script>
        <script type="module" src="./scripts/logout.js" defer></script>
        <script type="module" src="./scripts/modal_user.js"></script>
    </head>

    <body>
        <main>
            <nav>
                <button id="avatarBtn"><img id="avatar" alt="user avatar"></button>
            </nav>
            <div class="login-card">
                <div class="top">
                    <h1>Oauth Dashboard</h1>
                    <span id="securityStatus"></span>
                </div>
                
                <div class="dashboard">
                    <div class="middle">
                        <h2>Monitorization</h2>
                        <span>Password Defined</span>
                        <h6 id="passwordDefined"></h6>
                        
                    </div>
                    <div>
                        <h2>Quick Actions & Summary</h2>
                        <span>Quick Actions</span>
                        <button class="btn-right-side" id="definePassword">Define Password</button>
                        <button class="btn-right-side" id="dashboard">Go back to dashboard</button>
                        
                    </div>
                </div>
            </div>

            <div class="menu" id="menu">
                <a href="#">Profile</a>
                <a href="#">Settings</a>
                <a href="#">Security</a>
                <a  id="logoutA" href="#">Logout</a>
            </div>
        </main>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
